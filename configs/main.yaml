# 본 실험: 상품 100개 그래프 (9,900 방향 간선), 전체 분할
experiment: main
data:
  dataset: data/processed/rs_v3.pkl
  split: data/splits/rs_seed42.json
  max_nodes: 100
model:
  hidden_dim: 32
  heads: 4
  lambda_repulsion: 1.0
  initial_beta: 0.5
  memory_gain: 0.2
train:
  max_epochs: 12
  patience: 3
  lr: 0.001
  lambda_rep_loss: 0.5
  class_weight_cap: 8.0
ainet:
  tau: 0.25
  kappa: 3.0
eval:
  bootstrap: 2000
