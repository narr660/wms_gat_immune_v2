# 본 실험: 상품 100개 그래프 (9,900 방향 간선), 전체 분할
experiment: main
data:
  dataset: data/processed/rs_v3.pkl
  split: data/splits/rs_seed42.json
  max_nodes: 100
  sku_catalog: true          # 같은 (분류, 치수) = 같은 SKU = 같은 속성
  observability: partial     # 누출 위험 · 냄새 프로필 · 지지 한계는 도착 시점에 모른다
model:
  hidden_dim: 32
  heads: 4
  lambda_repulsion: 1.0
  initial_beta: 0.5
  memory_gain:
    odor: 0.0            # DCA가 이미 거의 완벽 (미탐지 0/5990) — 기억이 끼어들면 해친다
    contamination: 0.0   # DCA가 이미 거의 완벽 (미탐지 8/61189) — 기억이 끼어들면 해친다
    physical: 0.4        # DCA가 가장 부족한 관계 — 기억의 이득이 가장 크게 확인됨
train:
  max_epochs: 12
  patience: 3
  lr: 0.001
  lambda_rep_loss: 0.5
  class_weight_cap: 8.0
  memory_epochs: 4
  memory_dropout: 0.3
ainet:
  tau: 1.0
  kappa: 3.0
eval:
  bootstrap: 2000
